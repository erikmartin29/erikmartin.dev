version: 1
applications:
  - appRoot: apps/web
    frontend:
      buildPath: '/'
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - node -v
            - npm install -g pnpm@10.22.0
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm --filter web build
      artifacts:
        baseDirectory: apps/web/.next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
